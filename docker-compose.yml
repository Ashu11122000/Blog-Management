services:
  postgres:
    image: postgres:17
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_management_system
    ports:
      - "5435:5432"
    volumes:
      - blog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_management_system"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  blog-postgres-data:
